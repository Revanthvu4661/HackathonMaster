<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAR Hackathon Helper — Offline</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <!-- Firebase (compat SDK v10, CDN) — must load before any app script -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="theme.js"></script>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="styles/design-system.css">
  <style>
    .offline-center { display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:80vh; text-align:center; padding:2rem; }
    .offline-icon { font-size:4rem; margin-bottom:1.5rem; animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
    h1 { font-size:clamp(1.5rem,4vw,2.5rem); font-weight:800; margin-bottom:0.75rem; }
    p { color:var(--text-secondary); max-width:440px; margin:0 auto 2rem; line-height:1.6; }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <script src="js/navbar.js"></script>

  <div class="bg-orbs"><div class="orb orb-1"></div><div class="orb orb-2"></div></div>
  <div class="offline-center">
    <div class="offline-icon">📡</div>
    <h1>You're <span class="gradient-text">Offline</span></h1>
    <p>No internet connection detected. RAR Hackathon Helper works offline with its built-in knowledge base — but you'll need to reconnect for live AI responses.</p>
    <div style="display:flex;gap:1rem;flex-wrap:wrap;justify-content:center;">
      <button class="btn-primary" onclick="location.href='strategist.html'">⚡ Use Offline Strategist</button>
      <button class="btn-ghost" onclick="location.reload()">🔄 Try Again</button>
    </div>
    <p style="margin-top:2rem;font-size:0.8rem;color:var(--text-muted);">Tip: The offline knowledge base has 1000+ hackathon blueprints ready to use without internet.</p>
  </div>
</body>
</html>
