name: Update Live Hackathons

on:
  schedule:
    - cron: '0 2 * * *'   # Daily at 2 AM UTC (7:30 AM IST)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

# Required: the default GITHUB_TOKEN is read-only, so the push below would 403 without this.
permissions:
  contents: write

# Never run two updates at once (e.g. cron + manual trigger).
concurrency:
  group: update-hackathons
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch hackathons
        run: python scripts/fetch_hackathons.py

      - name: Sanity check output
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/hackathons.json", encoding="utf-8"))
          assert d["total"] == len(d["hackathons"]) >= 6, f"suspiciously small output: {d['total']}"
          print("OK:", d["total"], "hackathons")
          PY

      - name: Commit updated data
        run: |
          git config user.name "RAR Bot"
          git config user.email "bot@hackathonmaster.com"
          git add data/hackathons.json
          git diff --staged --quiet || git commit -m "🤖 Auto-update hackathons $(date -u +%Y-%m-%d)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
