  <style>
    /* hackathons.html: layout for the live-data page. Tokens/components come from design-system.css */
    .hk-head { margin-bottom: var(--sp-lg); }
    .hk-head h1 { font-size: var(--ds-fs-h2); font-weight: 500; letter-spacing: -0.02em; line-height: 1.2; }
    .hk-head .section-subtitle { margin-top: var(--sp-sm); }
    .hk-meta { display: flex; align-items: center; gap: var(--sp-sm); margin-top: var(--sp-md); font-size: 12px; color: var(--ds-text-2); }
    .hk-refresh { width: 28px; height: 28px; min-width: 28px; padding: 0; display: inline-flex; align-items: center; justify-content: center; border-radius: var(--r-btn); border: 1px solid var(--ds-border); background: transparent; color: var(--ds-text); cursor: pointer; transition: border-color var(--t-color), background-color var(--t-color); }
    .hk-refresh:hover { border-color: var(--ds-primary); background: rgba(124, 58, 237, 0.08); }
    .hk-refresh[disabled] { opacity: 0.6; cursor: progress; }
    .hk-refresh[disabled] svg { animation: hk-spin 1s linear infinite; }
    .hk-refresh::before { content: ''; position: absolute; width: 44px; height: 44px; } /* 44px touch target around the 28px icon button */
    .hk-refresh { position: relative; }

    /* sticky single-row filter bar */
    .hk-toolbar { position: sticky; top: var(--nav-height); z-index: 50; display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-sm); padding: var(--sp-sm) 0; margin: 0 0 var(--sp-md); background: rgba(10, 10, 15, 0.92); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-bottom: 1px solid var(--ds-border); }
    html[data-theme="light"] .hk-toolbar { background: rgba(248, 250, 252, 0.92); }
    .hk-toolbar .hk-field { min-height: 40px; padding: 0 12px; font-size: 0.8125rem; width: 100%; min-width: 0; }
    .hk-toolbar #hkSearch { grid-column: 1 / -1; }
    @media (min-width: 768px) { .hk-toolbar { grid-template-columns: minmax(0, 2fr) repeat(3, minmax(0, 1fr)); } .hk-toolbar #hkSearch { grid-column: auto; } }
    .hk-count { font-size: 12px; color: var(--ds-text-2); margin: 0 0 var(--sp-md); }

    /* grid: 1 / 2 / 3 columns */
    #hackathonGrid { grid-template-columns: 1fr; grid-auto-rows: 1fr; }
    @media (min-width: 640px)  { #hackathonGrid { grid-template-columns: repeat(2, 1fr); } }
    /* 3 columns from 1180px: below that a card is too narrow for Generate + Register + bell on one row */
    @media (min-width: 1180px) { #hackathonGrid { grid-template-columns: repeat(3, 1fr); } }

    /* card: uniform, left border coloured by platform (.card--devpost etc. from design-system.css) */
    .hackathon-card { display: flex; flex-direction: column; min-height: 220px; padding: var(--sp-lg); overflow: visible; }
    .hackathon-card .status-badge { align-self: flex-start; margin-bottom: var(--sp-sm); }
    .hack-title { font-size: var(--ds-fs-card); font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; margin: 0 0 var(--sp-xs); padding-right: 72px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .hack-title a { color: var(--ds-text); text-decoration: none; }
    .hack-title a:hover { color: var(--ds-primary-text); }
    .hack-org { color: var(--ds-text-2); font-size: 0.8125rem; margin-bottom: var(--sp-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hk-facts { display: flex; flex-wrap: wrap; gap: 0 var(--sp-md); margin: 0 0 var(--sp-sm); color: var(--ds-text-2); font-size: 0.8125rem; }
    .hk-row { display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-sm); margin-bottom: var(--sp-md); }
    .hack-prize { font-family: var(--ds-font-mono); font-variant-numeric: tabular-nums; font-size: 0.8125rem; color: var(--ds-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hack-actions { display: flex; flex-wrap: wrap; gap: var(--sp-sm); margin-top: auto; }
    .btn-gen-idea { flex: 1 1 130px; }
    .hack-actions .btn-register { flex: 0 0 auto; }
    /* phones: Generate Strategy / Register / bell stacked, full width */
    @media (max-width: 479px) {
      .hack-actions { flex-direction: column; flex-wrap: nowrap; }
      .hack-actions > * { width: 100%; flex: 0 0 auto; }
      .btn-gen-idea { flex: 0 0 auto; }
    }
    .btn-notify { min-width: 44px; min-height: 36px; padding: 0 12px; border-radius: var(--r-btn); border: 1px solid var(--ds-border); background: transparent; color: var(--ds-text); font: inherit; font-size: 1rem; cursor: pointer; transition: border-color var(--t-color), background-color var(--t-color); }
    .btn-notify:hover { border-color: var(--ds-primary); background: rgba(124, 58, 237, 0.08); }
    .btn-notify[aria-pressed="true"] { background: var(--ds-primary); border-color: var(--ds-primary); }
    .hackathon-card .badge-platform { top: var(--sp-lg); right: var(--sp-lg); }

    /* states */
    .hk-banner { margin: 0 0 var(--sp-md); padding: var(--sp-sm) var(--sp-md); border-radius: var(--r-card); border: 1px solid var(--ds-warning); background: transparent; color: var(--ds-text); font-size: 0.875rem; }
    .hk-banner.hk-error { border-color: var(--ds-danger); }
    .hk-skel { min-height: 220px; }
    .hk-skel span { display: block; height: 16px; margin-bottom: var(--sp-md); border-radius: var(--r-chip); background: linear-gradient(90deg, var(--ds-surface) 25%, var(--ds-surface-2) 50%, var(--ds-surface) 75%); background-size: 200% 100%; animation: hk-shimmer 1.4s linear infinite; }
    .hk-empty { grid-column: 1 / -1; text-align: center; padding: var(--sp-2xl) var(--sp-md); color: var(--ds-text-2); }
    .hk-more { display: flex; justify-content: center; margin-top: var(--sp-lg); }
    .hk-btn { min-width: 44px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; padding: 0 var(--sp-lg); border-radius: var(--r-btn); border: 1px solid var(--ds-border); background: transparent; color: var(--ds-text); font: inherit; font-weight: 500; cursor: pointer; transition: border-color var(--t-color), background-color var(--t-color); }
    .hk-btn:hover { border-color: var(--ds-primary); background: rgba(124, 58, 237, 0.08); }
    .hk-toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); max-width: calc(100vw - 32px); padding: 12px 24px; border-radius: var(--r-card); background: var(--ds-surface-2); border: 1px solid var(--ds-primary); color: var(--ds-text); z-index: 1000; }
    dialog.hk-dialog { padding: var(--sp-lg); width: min(420px, calc(100vw - 32px)); }
    dialog.hk-dialog form { display: grid; gap: var(--sp-md); }
    dialog.hk-dialog menu { display: flex; gap: var(--sp-sm); justify-content: flex-end; margin: 0; padding: 0; }
    .hk-primary { background: var(--ds-primary); border-color: var(--ds-primary); color: var(--ds-on-primary); }
    .hk-primary:hover { background: var(--ds-primary-hover); border-color: var(--ds-primary-hover); }
    @keyframes hk-shimmer { to { background-position: -200% 0; } }
    @keyframes hk-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .hk-skel span, .hk-refresh[disabled] svg { animation: none; } }
  </style>

  <script>
    // ===== Live hackathon data =====
    const DATA_URL = 'https://raw.githubusercontent.com/Revanthvu4661/HackathonMaster/main/data/hackathons.json';
    const LOCAL_URL = '/data/hackathons.json';
    const PAGE_SIZE = 24;
    const NOTIFY_KEY = 'rar_notifications'; // { notifications: [ids], email: "" }
    const $ = id => document.getElementById(id);
    let allHackathons = [], shown = PAGE_SIZE, pendingNotifyId = null;

    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // Third-party data: only allow http(s) links.
    const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';

    function readStore() {
      try { const v = JSON.parse(localStorage.getItem(NOTIFY_KEY)); return { notifications: v?.notifications || [], email: v?.email || '' }; }
      catch { return { notifications: [], email: '' }; }
    }
    function writeStore(v) { try { localStorage.setItem(NOTIFY_KEY, JSON.stringify(v)); } catch {} }

    function liveStatus(h) {
      if (!h.deadline_ts) return h.status || 'Live';
      const ms = h.deadline_ts * 1000 - Date.now();
      if (ms <= 0) return null; // expired: hide
      if (ms < 3 * 86400000) return 'Closing Soon';
      return h.status === 'Upcoming' ? 'Upcoming' : 'Live';
    }
    const STATUS_CLASS = { 'Live': 'status-live', 'Upcoming': 'status-upcoming', 'Closing Soon': 'status-closing' };

    function deadlineText(h) {
      if (!h.deadline_ts) return 'Rolling / annual';
      const d = new Date(h.deadline_ts * 1000);
      const days = Math.ceil((d - Date.now()) / 86400000);
      const date = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
      return `Closes ${date} (${days <= 0 ? 'today' : days === 1 ? '1 day' : days + ' days'} left)`;
    }

    function timeAgo(iso) {
      const mins = Math.max(0, Math.round((Date.now() - new Date(iso)) / 60000));
      if (mins < 60) return mins <= 1 ? 'just now' : `${mins} minutes ago`;
      const h = Math.round(mins / 60);
      if (h < 48) return `${h} hour${h === 1 ? '' : 's'} ago`;
      return `${Math.round(h / 24)} days ago`;
    }
    function showLastUpdated(iso, note) {
      $('lastUpdated').textContent = iso ? `Last updated: ${timeAgo(iso)}${note ? ' · ' + note : ''}` : (note || '');
    }

    function getView() {
      const q = $('hkSearch').value.trim().toLowerCase(), plat = $('hkPlatform').value, theme = $('hkTheme').value, sort = $('hkSort').value;
      let list = allHackathons.map(h => ({ h, st: liveStatus(h) })).filter(x => x.st);
      if (plat) list = list.filter(x => x.h.platform === plat);
      if (theme) list = list.filter(x => x.h.theme === theme);
      if (q) list = list.filter(x => [x.h.name, x.h.theme, x.h.platform, ...(x.h.tags || [])].join(' ').toLowerCase().includes(q));
      const far = Number.MAX_SAFE_INTEGER;
      if (sort === 'prize') list.sort((a, b) => (b.h.prize_numeric || 0) - (a.h.prize_numeric || 0));
      else if (sort === 'name') list.sort((a, b) => a.h.name.localeCompare(b.h.name));
      else list.sort((a, b) => (a.h.deadline_ts || far) - (b.h.deadline_ts || far));
      return list;
    }

    function cardHtml({ h, st }) {
      const on = readStore().notifications.includes(h.id);
      const reg = safeUrl(h.registrationUrl) !== '#' ? h.registrationUrl : '';   // no URL => no button (never a broken link)
      const src = ['devpost', 'devfolio', 'mlh', 'unstop'].includes(h.source) ? h.source : 'primary';
      const facts = [h.mode, h.duration && h.duration !== 'Varies' ? h.duration : '', h.teamSize && h.teamSize !== 'Varies' ? 'Team ' + h.teamSize : ''].filter(Boolean);
      let left = '<span class="days-left">Rolling</span>';
      if (h.deadline_ts) {
        const d = Math.max(0, Math.ceil((h.deadline_ts * 1000 - Date.now()) / 86400000));
        left = `<span class="days-left ${d < 3 ? 'days-left--urgent' : d < 7 ? 'days-left--soon' : ''}">${d === 0 ? 'Closes today' : d + 'd left'}</span>`;
      }
      return `
        <article class="hackathon-card card card--${src}">
          <span class="badge badge-platform badge-${src}">${esc(h.platform)}</span>
          <div class="status-badge ${STATUS_CLASS[st] || 'status-live'}">${esc(st)}</div>
          <h3 class="hack-title"><a href="${esc(safeUrl(h.link))}" target="_blank" rel="noopener noreferrer">${esc(h.name)}</a></h3>
          <div class="hack-org">${esc(h.theme || 'Open Theme')}</div>
          <div class="hk-facts">${facts.map(f => `<span>${esc(f)}</span>`).join('')}</div>
          <div class="hk-row"><span class="hack-prize">${esc(h.prize || 'See details')}</span>${left}</div>
          <div class="hack-actions">
            <button type="button" class="btn-secondary btn-sm btn-gen-idea" data-idea="${esc(`${h.name}: a ${h.theme || 'open theme'} project`)}">Generate Strategy →</button>
            ${reg ? `<a class="btn-register" href="${esc(reg)}" target="_blank" rel="noopener noreferrer" aria-label="Register for ${esc(h.name)} (opens in a new tab)">Register ↗</a>` : ''}
            <button type="button" class="btn-notify" data-id="${esc(h.id)}" data-name="${esc(h.name)}" aria-pressed="${on}" aria-label="${on ? 'Remove reminder for' : 'Remind me about'} ${esc(h.name)}">${on ? '🔔' : '🔕'}</button>
          </div>
        </article>`;
    }

    function renderHackathons() {
      const grid = $('hackathonGrid'), list = getView();
      grid.setAttribute('aria-busy', 'false');
      $('hkCount').textContent = list.length ? `${list.length} open hackathon${list.length === 1 ? '' : 's'}` : '';
      grid.innerHTML = list.length
        ? list.slice(0, shown).map(cardHtml).join('')
        : '<div class="hk-empty"><h3>No hackathons match</h3><p>Clear the search or pick “All platforms”.</p></div>';
      $('hkMore').hidden = list.length <= shown;
      $('hkMore').textContent = `Show more (${list.length - shown} left)`;
    }

    // Theme filter options come from the data itself (most common first)
    function fillThemes() {
      const sel = $('hkTheme'), keep = sel.value, count = {};
      allHackathons.forEach(h => { if (h.theme) count[h.theme] = (count[h.theme] || 0) + 1; });
      const themes = Object.keys(count).sort((a, b) => count[b] - count[a]).slice(0, 15);
      sel.innerHTML = '<option value="">All themes</option>' + themes.map(t => `<option>${esc(t)}</option>`).join('');
      sel.value = themes.includes(keep) ? keep : '';
    }

    function showSkeleton() {
      $('hackathonGrid').setAttribute('aria-busy', 'true');
      $('hackathonGrid').innerHTML = '<div class="hackathon-card card hk-skel" aria-hidden="true"><span></span><span></span><span></span><span></span></div>'.repeat(3);
    }

    async function fetchJson(url, ms = 8000) {
      const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms);
      try {
        const res = await fetch(url, { signal: ctl.signal, cache: 'no-cache' });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!Array.isArray(data.hackathons)) throw new Error('bad shape');
        return data;
      } finally { clearTimeout(t); }
    }

    async function loadHackathons() {
      const btn = $('refreshBtn');
      btn.disabled = true; $('hkBanner').innerHTML = '';
      showSkeleton();
      let data = null, note = '';
      try { data = await fetchJson(`${DATA_URL}?t=${Date.now()}`); }              // GitHub raw: always fresh
      catch (e1) {
        try { data = await fetchJson(LOCAL_URL); note = 'from site copy'; }       // same-origin fallback
        catch (e2) { data = null; }
      }
      if (data) {
        allHackathons = data.hackathons; showLastUpdated(data.last_updated, note);
      } else {
        allHackathons = FALLBACK_HACKATHONS; showLastUpdated(null, 'Offline data');
        $('hkBanner').innerHTML = '<div class="hk-banner hk-error">⚠️ Unable to load live hackathons. Showing cached data. Use the refresh button to try again.</div>';
      }
      fillThemes(); shown = PAGE_SIZE; renderHackathons(); checkDeadlineAlerts();
      btn.disabled = false;
    }

    // ===== Notify Me (stores intent only; no email is sent yet) =====
    function toast(msg) {
      const t = document.createElement('div');
      t.className = 'hk-toast'; t.setAttribute('role', 'status'); t.textContent = msg;
      document.body.appendChild(t); setTimeout(() => t.remove(), 3500);
    }
    function setNotify(id, on) {
      const s = readStore(), has = s.notifications.includes(id);
      if (on && !has) s.notifications.push(id);
      if (!on) s.notifications = s.notifications.filter(x => x !== id);
      writeStore(s);
    }
    function onNotifyClick(btn) {
      const id = btn.dataset.id;
      if (readStore().notifications.includes(id)) { setNotify(id, false); toast('Reminder removed.'); renderHackathons(); return; }
      pendingNotifyId = id;
      $('notifyName').textContent = btn.dataset.name;
      $('notifyEmail').value = readStore().email;
      $('notifyDialog').showModal(); $('notifyEmail').focus();
    }
    function checkDeadlineAlerts() {
      const ids = readStore().notifications;
      const soon = allHackathons.filter(h => ids.includes(h.id) && h.deadline_ts && h.deadline_ts * 1000 - Date.now() < 86400000 && h.deadline_ts * 1000 > Date.now());
      if (soon.length) $('hkBanner').insertAdjacentHTML('beforeend', `<div class="hk-banner">⏰ Closing within 24h: ${soon.map(h => `<strong>${esc(h.name)}</strong>`).join(', ')}</div>`);
    }

    document.addEventListener('DOMContentLoaded', () => {
      loadHackathons();
      $('refreshBtn').addEventListener('click', loadHackathons);
      $('hkMore').addEventListener('click', () => { shown += PAGE_SIZE; renderHackathons(); });
      ['hkSearch', 'hkPlatform', 'hkTheme', 'hkSort'].forEach(id => $(id).addEventListener('input', () => { shown = PAGE_SIZE; renderHackathons(); }));
      $('hackathonGrid').addEventListener('click', e => {
        const n = e.target.closest('.btn-notify'), g = e.target.closest('.btn-gen-idea');
        if (n) onNotifyClick(n);
        else if (g) generateFor(g.dataset.idea);
      });
      $('notifyCancel').addEventListener('click', () => $('notifyDialog').close());
      $('notifyForm').addEventListener('submit', () => {
        const s = readStore(); s.email = $('notifyEmail').value.trim(); writeStore(s);
        setNotify(pendingNotifyId, true);
        toast("We'll remind you 24h before deadline!"); renderHackathons();
      });
    });
  </script>

  <script>



    // History Sidebar Logic



    (function() {



      const sidebar = document.getElementById('historySidebar');



      const closeBtn = document.getElementById('closeHistory');



      const toggleBtn = document.getElementById('historyToggle');



      const badge = document.getElementById('historyBadge');







      if (closeBtn) {



        closeBtn.addEventListener('click', () => sidebar.classList.remove('open'));



      }







      // Close on backdrop click



      document.addEventListener('click', (e) => {



        if (sidebar && sidebar.classList.contains('open') &&



            !sidebar.contains(e.target) && e.target !== toggleBtn && !toggleBtn.contains(e.target)) {



          sidebar.classList.remove('open');



        }



      });







      // Also wire nav triggers



      document.querySelectorAll('.history-nav-trigger').forEach(el => {



        el.addEventListener('click', (e) => {



          e.preventDefault();



          sidebar.classList.add('open');



        });



      });







      // Render history from localStorage



      function renderHistory() {



        const list = document.getElementById('historyList');



        if (!list) return;



        const raw = localStorage.getItem('strat_history');



        const history = raw ? JSON.parse(raw) : [];



        if (history.length === 0) {



          list.innerHTML = `<div class="history-empty">



            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.3;margin-bottom:1rem;"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>



            <p>No recent solutions found.</p>



          </div>`;



          if (badge) badge.style.display = 'none';



          return;



        }



        if (badge) {



          badge.textContent = history.length;



          badge.style.display = 'flex';



        }



        list.innerHTML = history.map((item, i) => `



          <div class="history-item" onclick="loadHistory(${i})">



            <div class="history-item-title">${(item.problem || 'Untitled Project').substring(0, 60)}${(item.problem || '').length > 60 ? '...' : ''}</div>



            <div class="history-item-meta">



              <span class="history-item-tag">${item.industry || 'General'}</span>



              <span>${item.timestamp ? new Date(item.timestamp).toLocaleDateString() : ''}</span>



            </div>



          </div>



        `).join('');



      }







      renderHistory();







      window.loadHistory = function(index) {



        const raw = localStorage.getItem('strat_history');



        const history = raw ? JSON.parse(raw) : [];



        const item = history[index];



        if (!item) return;



        // Store the full item so strategist can restore it



        localStorage.setItem('latest_strat_result', JSON.stringify(item));



        localStorage.setItem('presetProject', (item.problem || '').substring(0, 100));



        window.location.href = 'strategist.html';



      };



    })();



  </script>
