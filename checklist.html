<head>

  <style>

    .checklist-container {

      max-width: 1000px;

      margin: 120px auto 60px;

      padding: 0 2rem;

    }



    .input-section {

      background: var(--glass-bg);

      backdrop-filter: blur(var(--glass-blur));

      border: 1px solid var(--glass-border);

      border-radius: 24px;

      padding: 2.5rem;

      margin-bottom: 2rem;

      text-align: center;

    }



    .input-group {

      display: flex;

      flex-wrap: wrap;

      gap: 1rem;

      margin-top: 1.5rem;

    }



    .input-group input {

      flex: 1 1 240px;

      min-width: 0;

      padding: 1rem 1.5rem;

      background: rgba(255, 255, 255, 0.05);

      border: 1px solid var(--glass-border);

      border-radius: 12px;

      color: var(--text-primary);

      font-size: 1rem;

      outline: none;

    }



    .progress-sticky {

      position: sticky;

      top: 100px;

      z-index: 100;

      background: var(--glass-bg);

      backdrop-filter: blur(20px);

      border: 1px solid var(--glass-border);

      border-radius: 16px;

      padding: 1.5rem;

      margin-bottom: 2rem;

      display: flex;

      align-items: center;

      gap: 2rem;

    }



    .progress-info {

      flex: 1;

    }



    .progress-bar-bg {

      width: 100%;

      height: 12px;

      background: rgba(255, 255, 255, 0.1);

      border-radius: 6px;

      margin-top: 0.5rem;

      overflow: hidden;

    }



    .progress-bar-fill {

      height: 100%;

      background: var(--accent-gradient);

      width: 0%;

      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);

    }



    .phases-grid {

      display: grid;

      grid-template-columns: 1fr;

      gap: 2rem;

    }



    .phase-card {

      background: var(--glass-bg);

      border: 1px solid var(--glass-border);

      border-radius: 20px;

      padding: 2rem;

      transition: transform 0.3s ease;

    }



    .phase-header {

      display: flex;

      justify-content: space-between;

      align-items: center;

      margin-bottom: 1.5rem;

      border-bottom: 1px solid rgba(255, 255, 255, 0.05);

      padding-bottom: 1rem;

    }



    .phase-name {

      font-size: 1.25rem;

      font-weight: 700;

      color: var(--accent-primary);

      display: flex;

      align-items: center;

      gap: 0.75rem;

    }



    .task-list {

      display: flex;

      flex-direction: column;

      gap: 1rem;

    }



    .task-item {

      display: flex;

      align-items: flex-start;

      gap: 1rem;

      padding: 1rem;

      background: rgba(255, 255, 255, 0.03);

      border-radius: 12px;

      cursor: pointer;

      transition: all 0.2s ease;

      border: 1px solid transparent;

    }



    .task-item:hover {

      background: rgba(255, 255, 255, 0.06);

      border-color: rgba(255, 255, 255, 0.1);

    }



    .task-item.completed {

      opacity: 0.6;

    }



    .task-item.completed .task-text {

      text-decoration: line-through;

      color: var(--text-secondary);

    }



    .checkbox {

      width: 22px;

      height: 22px;

      border: 2px solid var(--accent-primary);

      border-radius: 6px;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-shrink: 0;

      transition: all 0.2s;

    }



    .task-item.completed .checkbox {

      background: var(--accent-primary);

    }



    .checkbox svg {

      color: white;

      display: none;

    }



    .task-item.completed .checkbox svg {

      display: block;

    }



    .task-text {

      font-size: 1rem;

      line-height: 1.5;

      color: var(--text-primary);

    }



    .export-btn {

      position: fixed;

      bottom: 2rem;

      right: 2rem;

      z-index: 1000;

      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

    }



    /* Loading State */

    .loader {

      display: none;

      width: 40px;

      height: 40px;

      border: 4px solid rgba(255, 255, 255, 0.1);

      border-left-color: var(--accent-primary);

      border-radius: 50%;

      animation: spin 1s linear infinite;

      margin: 2rem auto;

    }



    @keyframes spin {

      to { transform: rotate(360deg); }

    }



    /* PDF Print Styles */

    @media print {

      body { background: white; color: black; }

      .navbar, .input-section, .export-btn, .progress-sticky { display: none !important; }

      .checklist-container { margin: 0; padding: 2rem; width: 100%; }

      .phase-card { break-inside: avoid; border: 1px solid #eee; margin-bottom: 2rem; background: none; }

      .task-item { background: none; border: 1px solid #f0f0f0; }

    }

  </style>

  <style>

    .history-toggle {

      display: flex !important;

    }

  </style>

<body class="dark-theme">
  <div id="navbar-placeholder"></div>
  <script src="js/navbar.js"></script>


  <!-- Animated Background -->

  <div class="bg-orbs">

    <div class="orb orb-1"></div>

    <div class="orb orb-2"></div>

    <div class="orb orb-3"></div>

  </div>

  <div class="grid-overlay"></div>



  <!-- Navigation -->

  





  <!-- Mobile Menu -->

  



  <main class="checklist-container">

    <div class="input-section">

      <h1 style="font-size: var(--ds-fs-h2); font-weight: 500;">Action Roadmap</h1>

      <p style="color: var(--text-secondary); margin-top: 0.5rem;">Turn your hackathon vision into a step-by-step execution plan.</p>

      <div class="input-group">

        <input type="text" id="projectIdea" placeholder="Describe your project (e.g. AI-powered recipe generator for food waste)...">

        <button class="btn-primary" id="generateBtn">Generate Checklist</button>

      </div>

      <div class="loader" id="loader"></div>

    </div>



    <div id="checklistOutput" style="display: none;">

      <div class="progress-sticky">

        <div class="progress-info">

          <div style="display: flex; justify-content: space-between; align-items: center;">

            <span style="font-weight: 700; font-size: 1.1rem;">Overall Progress</span>

            <span id="progressPercent" style="color: var(--accent-primary); font-weight: 800;">0%</span>

          </div>

          <div class="progress-bar-bg">

            <div class="progress-bar-fill" id="progressBar"></div>

          </div>

        </div>

        <div id="statsInfo" style="text-align: right; color: var(--text-secondary); font-size: 0.9rem;">

          0 / 0 Tasks Completed

        </div>

      </div>



      <div id="phasesContainer" class="phases-grid"></div>

    </div>

  </main>



  <button class="btn-primary export-btn" id="exportBtn" style="display: none;">

    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>

    Export PDF

  </button>



  <script src="theme.js"></script>

  <script>

    const generateBtn = document.getElementById('generateBtn');

    const inputField = document.getElementById('projectIdea');

    const loader = document.getElementById('loader');

    const output = document.getElementById('checklistOutput');

    const container = document.getElementById('phasesContainer');

    const exportBtn = document.getElementById('exportBtn');



    let currentChecklist = null;



    async function generateChecklist(idea) {

      loader.style.display = 'block';

      generateBtn.disabled = true;



      if (window.waitForAuth) await window.waitForAuth();   // let Firebase restore the session before deciding live vs offline
      if (!(window.canUseAI && window.canUseAI())) {

        // Offline Fallback

        const fallback = getOfflineChecklist(idea);

        renderChecklist(fallback);

      } else {

        try {

          const prompt = `Generate a comprehensive, phase-by-phase hackathon project checklist for the idea: "${idea}". 

          Structure it into exactly these phases: Ideation, Setup, Build, Polish, Demo, Submit.

          For each phase, provide 4-6 specific, actionable tasks.

          Return ONLY valid JSON in this exact format:

          {

            "project": "${idea}",

            "phases": [

              { "name": "Ideation", "tasks": ["Task 1", "Task 2"] },

              ...

            ]

          }`;



          const data = await callGemini('gemini-2.0-flash', [{ parts: [{ text: prompt }] }], { temperature: 0.5, maxOutputTokens: 2000 });

          const text = data.candidates[0].content.parts[0].text;

          const jsonMatch = text.match(/\{[\s\S]*\}/);

          const checklist = JSON.parse(jsonMatch[0]);

          renderChecklist(checklist);

        } catch (err) {

          console.error("AI Generation failed, using fallback", err);

          renderChecklist(getOfflineChecklist(idea));

        }

      }

      

      loader.style.display = 'none';

      generateBtn.disabled = false;

    }



    function getOfflineChecklist(idea) {

      return {

        project: idea,

        phases: [

          { name: "Ideation", tasks: ["Define core problem and target audience", "Map out user journey and 'Magic Moment'", "Select Tech Stack (Frontend, Backend, DB)", "Research existing solutions and differentiators"] },

          { name: "Setup", tasks: ["Initialize Git repository and project structure", "Setup Auth (Clerk/Supabase/Firebase)", "Configure Database and basic Schema", "Deploy 'Hello World' to Vercel/Netlify"] },

          { name: "Build", tasks: ["Implement core Landing Page and Navigation", "Develop Primary Dashboard and Feature UI", "Build API endpoints for data handling", "Integrate AI services (Gemini/OpenAI)"] },

          { name: "Polish", tasks: ["Apply Dark Mode and Framer Motion animations", "Conduct responsive testing on mobile devices", "Add error handling and loading states", "Optimize assets and performance scores"] },

          { name: "Demo", tasks: ["Record a high-quality 2-minute demo video", "Create project slides (Problem, Solution, Tech)", "Prepare a live-demo script with zero-downtime path", "Capture high-res screenshots for the README"] },

          { name: "Submit", tasks: ["Write a detailed README.md and Devpost story", "Verify all environment variables are set", "Submit project to platform before deadline", "Post on social media to build traction"] }

        ]

      };

    }



    function renderChecklist(data) {

      currentChecklist = data;

      localStorage.setItem('activeChecklist', JSON.stringify(data));

      

      container.innerHTML = '';

      output.style.display = 'block';

      exportBtn.style.display = 'flex';



      // Load checked states from localStorage

      const savedStates = JSON.parse(localStorage.getItem('checklistStates') || '{}');



      data.phases.forEach((phase, pIdx) => {

        const card = document.createElement('div');

        card.className = 'phase-card';

        

        let tasksHtml = '';

        phase.tasks.forEach((task, tIdx) => {

          const id = `p${pIdx}t${tIdx}`;

          const isDone = savedStates[id] || false;

          tasksHtml += `

            <div class="task-item ${isDone ? 'completed' : ''}" data-id="${id}">

              <div class="checkbox">

                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>

              </div>

              <span class="task-text">${task}</span>

            </div>

          `;

        });



        card.innerHTML = `

          <div class="phase-header">

            <span class="phase-name">

              <span style="width: 28px; height: 28px; background: rgba(167, 139, 250, 0.2); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.9rem;">${pIdx + 1}</span>

              ${phase.name}

            </span>

          </div>

          <div class="task-list">${tasksHtml}</div>

        `;

        container.appendChild(card);

      });



      updateProgress();



      // Add Click Listeners

      document.querySelectorAll('.task-item').forEach(item => {

        item.onclick = () => {

          item.classList.toggle('completed');

          const id = item.dataset.id;

          const states = JSON.parse(localStorage.getItem('checklistStates') || '{}');

          states[id] = item.classList.contains('completed');

          localStorage.setItem('checklistStates', JSON.stringify(states));

          updateProgress();

        };

      });

    }



    function updateProgress() {

      const allTasks = document.querySelectorAll('.task-item');

      const completed = document.querySelectorAll('.task-item.completed');

      const total = allTasks.length;

      const done = completed.length;

      const percent = total > 0 ? Math.round((done / total) * 100) : 0;



      document.getElementById('progressBar').style.width = percent + '%';

      document.getElementById('progressPercent').textContent = percent + '%';

      document.getElementById('statsInfo').textContent = `${done} / ${total} Tasks Completed`;

    }



    generateBtn.onclick = () => {

      const idea = inputField.value.trim();

      if (idea) {

        // Clear previous states when new checklist is generated

        localStorage.removeItem('checklistStates');

        generateChecklist(idea);

      } else {

        alert("Please enter a project idea first!");

      }

    };



    exportBtn.onclick = () => {

      const element = document.getElementById('checklistOutput');

      const opt = {

        margin: 1,

        filename: 'hackathon_checklist.pdf',

        image: { type: 'jpeg', quality: 0.98 },

        html2canvas: { scale: 2, useCORS: true, backgroundColor: '#0f172a' },

        jsPDF: { unit: 'in', format: 'letter', orientation: 'portrait' }

      };

      html2pdf().set(opt).from(element).save();

    };



    // Load state on start

    window.onload = () => {

      const saved = localStorage.getItem('activeChecklist');

      if (saved) {

        renderChecklist(JSON.parse(saved));

        inputField.value = JSON.parse(saved).project;

      }

    };

  </script>



  <!-- History Sidebar -->

  <div class="history-sidebar" id="historySidebar">

    <div class="history-header">

      <h3>

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>

        Recent Solutions

      </h3>

      <button class="close-history" id="closeHistory">

        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

      </button>

    </div>

    <div class="history-list" id="historyList">

      <div class="history-empty">

        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.3; margin-bottom:1rem;"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>

        <p>No recent solutions found.</p>

      </div>

    </div>

  </div>



  <button id="historyToggle" class="history-toggle"

    onclick="document.getElementById('historySidebar').classList.add('open')"

    title="View Recent Solutions">

    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>

    History

    <span id="historyBadge" class="history-badge" style="display:none;">0</span>

  </button>



  <script>

    // History Sidebar Logic

    (function() {

      const sidebar = document.getElementById('historySidebar');

      const closeBtn = document.getElementById('closeHistory');

      const toggleBtn = document.getElementById('historyToggle');

      const badge = document.getElementById('historyBadge');



      if (closeBtn) {

        closeBtn.addEventListener('click', () => sidebar.classList.remove('open'));

      }



      // Close on backdrop click

      document.addEventListener('click', (e) => {

        if (sidebar && sidebar.classList.contains('open') &&

            !sidebar.contains(e.target) && e.target !== toggleBtn && !toggleBtn.contains(e.target)) {

          sidebar.classList.remove('open');

        }

      });



      // Also wire nav triggers

      document.querySelectorAll('.history-nav-trigger').forEach(el => {

        el.addEventListener('click', (e) => {

          e.preventDefault();

          sidebar.classList.add('open');

        });

      });



      // Render history from localStorage

      function renderHistory() {

        const list = document.getElementById('historyList');

        if (!list) return;

        const raw = localStorage.getItem('strat_history');

        const history = raw ? JSON.parse(raw) : [];

        if (history.length === 0) {

          list.innerHTML = `<div class="history-empty">

            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="opacity:0.3;margin-bottom:1rem;"><path d="M12 8v4l3 3"/><circle cx="12" cy="12" r="10"/></svg>

            <p>No recent solutions found.</p>

          </div>`;

          if (badge) badge.style.display = 'none';

          return;

        }

        if (badge) {

          badge.textContent = history.length;

          badge.style.display = 'flex';

        }

        list.innerHTML = history.map((item, i) => `

          <div class="history-item" onclick="loadHistory(${i})">

            <div class="history-item-title">${(item.problem || 'Untitled Project').substring(0, 60)}${(item.problem || '').length > 60 ? '...' : ''}</div>

            <div class="history-item-meta">

              <span class="history-item-tag">${item.industry || 'General'}</span>

              <span>${item.timestamp ? new Date(item.timestamp).toLocaleDateString() : ''}</span>

            </div>

          </div>

        `).join('');

      }



      renderHistory();



      window.loadHistory = function(index) {

        const raw = localStorage.getItem('strat_history');

        const history = raw ? JSON.parse(raw) : [];

        const item = history[index];

        if (!item) return;

        // Store the full item so strategist can restore it

        localStorage.setItem('latest_strat_result', JSON.stringify(item));

        localStorage.setItem('presetProject', (item.problem || '').substring(0, 100));

        window.location.href = 'strategist.html';

      };

    })();

  </script>
