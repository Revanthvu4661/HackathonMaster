<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RAR Hackathon Helper — Tech Stack Comparator</title>
  <meta name="theme-color" content="#a78bfa" />
  <meta name="description" content="Compare tech stacks side-by-side for your hackathon project. AI picks the winner based on your constraints." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="styles/design-system.css">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json" />
  <!-- Firebase (compat SDK v10, CDN) — must load before any app script -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-analytics-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/db.js"></script>
  <script src="js/auth-ui.js"></script>
  <script src="js/api.js"></script>
  <script src="theme.js"></script>
  <style>
    /* compare.html: form + comparison output. Tokens/components from design-system.css */
    .compare-hero { text-align: left; padding: var(--sp-2xl) var(--sp-md) var(--sp-lg); max-width: var(--max-width); margin: 0 auto; }
    .compare-hero h1 { font-size: var(--ds-fs-h2); font-weight: 500; letter-spacing: -0.02em; margin-bottom: var(--sp-sm); }
    .compare-hero p { color: var(--ds-text-2); max-width: 62ch; margin: 0; }
    .compare-form { max-width: 680px; margin: 0 auto; background: var(--ds-surface); border: 1px solid var(--ds-border); border-radius: var(--r-card); padding: var(--sp-lg); }
    .compare-form label { display: block; font-size: 0.8125rem; color: var(--ds-text-2); margin: var(--sp-md) 0 var(--sp-xs); font-weight: 500; text-transform: none; letter-spacing: 0; }
    .compare-form input, .compare-form select, .compare-form textarea { width: 100%; }
    .compare-form textarea { min-height: 96px; resize: vertical; }
    .compare-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--sp-md); max-width: 1000px; margin: var(--sp-xl) auto; }
    .compare-card { background: var(--ds-surface); border: 1px solid var(--ds-border); border-radius: var(--r-card); padding: var(--sp-lg); transition: border-color var(--t-color); }
    .compare-card.winner-card { border-color: var(--ds-success); box-shadow: none; }
    .compare-card h3 { font-size: var(--ds-fs-card); margin: 0 0 var(--sp-sm); }
    .compare-badge { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: var(--r-chip); font-weight: 600; margin-bottom: var(--sp-sm); }
    .badge-winner { background: rgba(16, 185, 129, 0.15); color: var(--ds-success); border: 1px solid rgba(16, 185, 129, 0.4); }
    .badge-alt { background: var(--ds-surface-2); color: var(--ds-primary-text); border: 1px solid var(--ds-border); }
    .compare-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--ds-border); font-size: 0.875rem; }
    .compare-row:last-child { border-bottom: none; }
    .compare-row .label { color: var(--ds-text-2); }
    .compare-row .val { font-weight: 500; }
    .score-bar { background: var(--ds-surface-2); border-radius: 2px; height: 4px; margin-top: 4px; overflow: hidden; }
    .score-fill { height: 100%; border-radius: 2px; }
    .why-win { margin-top: var(--sp-md); padding: var(--sp-md); background: var(--ds-well); border-radius: var(--r-card); font-size: 0.8125rem; color: var(--ds-text-2); }
    #compareOutput { display: none; }
    .loading-pulse { animation: pulse 1.5s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

    /* feature matrix: sticky header + sticky first column, alternating rows.
       !important because compare.html's JS writes inline cell styles. */
    #cmpTable { border-collapse: separate !important; border-spacing: 0; }
    #cmpTable thead th { position: sticky; top: 0; z-index: 2; background: var(--ds-surface-2) !important; color: var(--ds-text) !important; font-family: var(--ds-font-display); font-weight: 500; }
    #cmpTable tbody tr:nth-child(odd) td { background: var(--ds-surface) !important; }
    #cmpTable tbody tr:nth-child(even) td { background: var(--ds-bg) !important; }
    #cmpTable th:first-child, #cmpTable td:first-child { position: sticky; left: 0; z-index: 1; white-space: nowrap; color: var(--ds-text-2) !important; }
    #cmpTable thead th:first-child { z-index: 3; }
    #cmpTable td { border-bottom: 1px solid var(--ds-border); }
  </style>
</head>
<body>
  <div id="navbar-placeholder"></div>
  <script src="js/navbar.js"></script>


  <div class="bg-orbs">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
  </div>

  <!-- NAV -->
  



  <main>
    <div class="compare-hero">
      <h1>⚡ Tech Stack Comparator</h1>
      <p>Tell us your project and constraints — RAR compares 3 tech stacks and picks the hackathon winner.</p>
    </div>

    <div class="compare-form">
      <label>Project Type / Description</label>
      <textarea id="cmpProject" placeholder="e.g. A real-time food delivery app with AI route optimization and a mobile-friendly dashboard..."></textarea>

      <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:0.75rem;">
        <div>
          <label>Team Size</label>
          <select id="cmpTeam">
            <option value="solo">Solo</option>
            <option value="2">2 people</option>
            <option value="3-4" selected>3–4 people</option>
            <option value="5+">5+ people</option>
          </select>
        </div>
        <div>
          <label>Hackathon Duration</label>
          <select id="cmpTime">
            <option value="12h">12 hours</option>
            <option value="24h" selected>24 hours</option>
            <option value="36h">36 hours</option>
            <option value="48h">48 hours</option>
            <option value="72h">72+ hours</option>
          </select>
        </div>
        <div>
          <label>Primary Skill</label>
          <select id="cmpSkill">
            <option value="frontend">Frontend</option>
            <option value="fullstack" selected>Full-Stack</option>
            <option value="backend">Backend</option>
            <option value="ml">ML / AI</option>
            <option value="mobile">Mobile</option>
          </select>
        </div>
      </div>

      <label>Any constraints? (optional)</label>
      <input id="cmpConstraints" type="text" placeholder="e.g. no paid APIs, must work offline, judges prefer mobile apps..." />

      <button class="btn-primary" id="cmpGenerate" style="width:100%;padding:0.9rem;">
        <span id="cmpBtnText">⚡ Compare Tech Stacks with AI</span>
        <span id="cmpBtnLoading" style="display:none;" class="loading-pulse">Analyzing stacks...</span>
      </button>
    </div>

    <div id="compareOutput">
      <div style="text-align:center;margin:2rem 0 1rem;">
        <h2 style="font-size:1.5rem;font-weight:700;" id="cmpSummaryTitle">Stack Comparison</h2>
        <p id="cmpSummaryDesc" style="color:var(--text-secondary);max-width:500px;margin:0 auto;font-size:0.9rem;"></p>
      </div>
      <div class="compare-grid" id="cmpGrid"></div>

      <div style="max-width:1000px;margin:0 auto 4rem;background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;overflow:hidden;">
        <div style="padding:1rem 1.5rem;background:rgba(16,185,129,0.08);border-bottom:1px solid rgba(16,185,129,0.2);">
          <h3 style="margin:0;font-size:1rem;color:#10b981;">📊 Side-by-Side Feature Matrix</h3>
        </div>
        <div style="overflow:auto;max-height:75vh;">
          <table id="cmpTable" style="width:100%;border-collapse:collapse;font-size:0.85rem;">
            <thead></thead><tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <script>
  document.getElementById('cmpGenerate').addEventListener('click', async () => {
    const project = document.getElementById('cmpProject').value.trim();
    if (!project) { alert('Please describe your project first.'); return; }

    if (window.waitForAuth) await window.waitForAuth();   // let Firebase restore the session before deciding live vs offline
    const useAI = !!(window.canUseAI && window.canUseAI());
    const btnText = document.getElementById('cmpBtnText');
    const btnLoad = document.getElementById('cmpBtnLoading');
    btnText.style.display = 'none'; btnLoad.style.display = 'inline';

    const constraints = {
      project,
      team: document.getElementById('cmpTeam').value,
      time: document.getElementById('cmpTime').value,
      skill: document.getElementById('cmpSkill').value,
      extra: document.getElementById('cmpConstraints').value
    };

    let stacks;

    if (useAI) {
      const prompt = `You are RAR, a hackathon tech stack expert. Compare 3 optimal tech stacks for this project.
Project: ${constraints.project}
Team: ${constraints.team}, Time: ${constraints.time}, Skill focus: ${constraints.skill}, Constraints: ${constraints.extra||'none'}

Return JSON with this structure:
{"summary":"one sentence about the comparison","stacks":[{"name":"Stack Name","tagline":"...","setup_time":"30 min","learning_curve":"Low/Medium/High","scalability":"Low/Medium/High","hackathon_suitability":90,"scores":{"speed":85,"ui":80,"backend":75,"ai_friendly":70,"deployment":90},"pros":["...","...","..."],"cons":["...","..."],"why_wins_hackathons":"...","winner":false}]}
Make exactly 3 stacks. Set winner:true for the best one only. Return ONLY valid JSON.`;

      try {
        const json = await callGemini('gemini-2.0-flash', [{ parts: [{ text: prompt }] }], {temperature:0.5,maxOutputTokens:2048,responseMimeType:'application/json'});
        let raw = json.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
        raw = raw.replace(/^```json?\s*/i,'').replace(/```\s*$/,'').trim();
        const parsed = JSON.parse(raw);
        stacks = parsed;
      } catch(err) {
        stacks = getOfflineStacks(constraints);
      }
    } else {
      stacks = getOfflineStacks(constraints);
    }

    renderComparison(stacks, constraints);
    btnText.style.display = 'inline'; btnLoad.style.display = 'none';
  });

  function getOfflineStacks(c) {
    const isML = c.skill === 'ml';
    const isMobile = c.skill === 'mobile';
    return {
      summary: `Best stacks for a ${c.team} team with ${c.time} and ${c.skill} background.`,
      stacks: [
        { name: isML ? 'Python + FastAPI + Streamlit' : isMobile ? 'React Native + Expo + Firebase' : 'Next.js + Supabase + Vercel',
          tagline: 'The proven hackathon winner', setup_time:'15 min', learning_curve:'Low', scalability:'High', hackathon_suitability:92,
          scores:{speed:90,ui:85,backend:88,ai_friendly:isML?95:75,deployment:95},
          pros:['Fastest setup','Huge community & templates','One-click deploy'],
          cons:['Can feel generic','Less unique to judges'],
          why_wins_hackathons:'Used by 60% of winning hackathon teams — the ecosystem is optimized for speed.', winner:true },
        { name: isML ? 'Node.js + Express + React' : isMobile ? 'Flutter + Firebase' : 'React + Node.js + MongoDB',
          tagline: 'The flexible full-stack', setup_time:'30 min', learning_curve:'Medium', scalability:'High', hackathon_suitability:80,
          scores:{speed:78,ui:82,backend:80,ai_friendly:65,deployment:75},
          pros:['Highly flexible','Full control','Scalable architecture'],
          cons:['More boilerplate','Slower initial setup'],
          why_wins_hackathons:'Judges appreciate clean REST APIs and real data persistence.', winner:false },
        { name: isML ? 'Hugging Face + Gradio + Modal' : isMobile ? 'Swift + Xcode + CloudKit' : 'Flask + React + PostgreSQL',
          tagline: 'The technical power move', setup_time:'45 min', learning_curve:'High', scalability:'Medium', hackathon_suitability:72,
          scores:{speed:65,ui:70,backend:85,ai_friendly:isML?98:60,deployment:65},
          pros:['Technically impressive','Shows depth','Great for ML demos'],
          cons:['Steep setup','Risk of not finishing in time'],
          why_wins_hackathons:'High wow factor with judges who value technical depth over polish.', winner:false },
      ]
    };
  }

  function renderComparison(data, c) {
    document.getElementById('compareOutput').style.display = 'block';
    try { if (window.trackEvent) trackEvent('stack_compared'); } catch (e) {}   // [Firebase] analytics, additive
    document.getElementById('cmpSummaryTitle').textContent = '⚡ Stack Comparison Results';
    document.getElementById('cmpSummaryDesc').textContent = data.summary || '';

    const grid = document.getElementById('cmpGrid');
    grid.innerHTML = '';

    const colors = ['#a78bfa','#06b6d4','#f59e0b'];
    const scoreLabels = { speed:'Build Speed', ui:'UI Quality', backend:'Backend Power', ai_friendly:'AI-Friendly', deployment:'Deploy Ease' };

    (data.stacks||[]).forEach((s,i) => {
      const card = document.createElement('div');
      card.className = 'compare-card' + (s.winner?' winner-card':'');
      card.innerHTML = `
        <h3>${s.name}</h3>
        <span class="compare-badge ${s.winner?'badge-winner':'badge-alt'}">${s.winner?'🏆 RECOMMENDED':'Alternative'}</span>
        <p style="font-size:0.82rem;color:var(--text-muted);margin:0 0 0.75rem;">${s.tagline}</p>
        <div class="compare-row"><span class="label">Setup Time</span><span class="val">${s.setup_time}</span></div>
        <div class="compare-row"><span class="label">Learning Curve</span><span class="val">${s.learning_curve}</span></div>
        <div class="compare-row"><span class="label">Scalability</span><span class="val">${s.scalability}</span></div>
        <div class="compare-row"><span class="label">Hackathon Fit</span><span class="val" style="color:${colors[i]};">${s.hackathon_suitability}/100</span></div>
        ${Object.entries(s.scores||{}).map(([k,v])=>`
          <div style="margin-top:8px;"><div style="display:flex;justify-content:space-between;font-size:0.78rem;color:var(--text-muted);margin-bottom:3px;"><span>${scoreLabels[k]||k}</span><span>${v}</span></div>
          <div class="score-bar"><div class="score-fill" style="width:${v}%;background:${colors[i]};"></div></div></div>`).join('')}
        <div class="why-win">💡 ${s.why_wins_hackathons}</div>
        ${s.pros?.length?`<div style="margin-top:0.75rem;"><div style="font-size:0.75rem;font-weight:700;color:#10b981;margin-bottom:4px;">PROS</div>${s.pros.map(p=>`<div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:2px;">✓ ${p}</div>`).join('')}</div>`:''}
        ${s.cons?.length?`<div style="margin-top:0.5rem;"><div style="font-size:0.75rem;font-weight:700;color:#ef4444;margin-bottom:4px;">CONS</div>${s.cons.map(p=>`<div style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:2px;">✗ ${p}</div>`).join('')}</div>`:''}
      `;
      grid.appendChild(card);
    });

    // Build comparison table
    const table = document.getElementById('cmpTable');
    const stacks = data.stacks || [];
    const rows = ['setup_time','learning_curve','scalability','hackathon_suitability'];
    const rowLabels = { setup_time:'Setup Time', learning_curve:'Learning Curve', scalability:'Scalability', hackathon_suitability:'Hackathon Score' };
    table.querySelector('thead').innerHTML = `<tr><th style="padding:10px 16px;text-align:left;color:var(--text-muted);font-size:0.8rem;border-bottom:1px solid var(--border-color);">Criteria</th>${stacks.map(s=>`<th style="padding:10px 16px;text-align:center;font-size:0.82rem;border-bottom:1px solid var(--border-color);">${s.name}${s.winner?' 🏆':''}</th>`).join('')}</tr>`;
    table.querySelector('tbody').innerHTML = rows.map(r=>`<tr>${[`<td style="padding:8px 16px;color:var(--text-muted);font-size:0.82rem;">${rowLabels[r]||r}</td>`, ...stacks.map(s=>`<td style="padding:8px 16px;text-align:center;font-size:0.82rem;font-weight:${s.winner?'700':'400'};">${s[r]||'-'}</td>`)].join('')}</tr>`).join('');
    document.getElementById('compareOutput').scrollIntoView({behavior:'smooth'});
  }
  </script>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');
  </script>
<footer class="ds-footer site-footer">
  <div class="ds-footer-inner site-footer-inner">
    <span class="footer-copy">© 2026 Revanth Sai Sankar Alapati</span>

      <a href="https://github.com/Revanthvu4661/HackathonMaster" target="_blank" rel="noopener noreferrer" class="footer-link">GitHub</a>
      <span class="footer-dot" aria-hidden="true">·</span>
      <span class="footer-badge">Built with Gemini 2.0</span>
    </div>
  </div>
</footer>
</body>
</html>
